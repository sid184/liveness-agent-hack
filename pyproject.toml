[project]
name = "liveness-agent"
version = "0.1.0"
description = "Moment-of-action liveness via physical challenge-response, judged by a video agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.10",
    "openai>=1.50",
    "wandb>=0.19",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "weave>=0.53.12",
    "vastdb>=2.1.0",
    "pyarrow>=23.0.1",
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
